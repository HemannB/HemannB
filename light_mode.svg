            fill: #1a7f37;
            font-family:
                "Courier New",
                "Liberation Mono",
                monospace;
            font-size: 15px;
            font-weight: 700;
        }

        .value {
            fill: #24292f;
            font-family:
                "Courier New",
                "Liberation Mono",
                monospace;
            font-size: 15px;
        }

        .section {
            fill: #0969da;
            font-family:
                "Courier New",
                "Liberation Mono",
                monospace;
            font-size: 16px;
            font-weight: 700;
        }

        .status {
            fill: #24292f;
            font-family:
                "Courier New",
                "Liberation Mono",
                monospace;
            font-size: 15px;
        }

        .prompt {
            fill: #1a7f37;
            font-family:
                "Courier New",
                "Liberation Mono",
                monospace;
            font-size: 18px;
            font-weight: 700;
        }

        .separator {
            stroke: #d8dee4;
            stroke-width: 1;
        }

        .cursor {
            fill: #1a7f37;
        }
    </style>


    
    
    

