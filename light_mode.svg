    <style>
        .background {
            fill: #ffffff;
        }

        .panel {
            fill: #f6f8fa;
            stroke: #d0d7de;
            stroke-width: 1.5;
        }

        .ascii {
            fill: #24292f;
            font-family:
                "Courier New",
                "Liberation Mono",
                monospace;
            font-size: 5.2px;
            font-weight: 400;
        }

        .title {
            fill: #0969da;
            font-family:
                "Courier New",
                "Liberation Mono",
                monospace;
            font-size: 21px;
            font-weight: 700;
        }

